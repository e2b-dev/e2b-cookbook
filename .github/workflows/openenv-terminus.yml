name: OpenEnv Terminus offline checks
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'examples/openenv-terminus-python/**'
      - '.github/workflows/openenv-terminus.yml'
  push:
    branches: [main]
    paths:
      - 'examples/openenv-terminus-python/**'
      - '.github/workflows/openenv-terminus.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    defaults:
      run:
        working-directory: examples/openenv-terminus-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra training
      - run: uv run --frozen --extra training pytest -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
