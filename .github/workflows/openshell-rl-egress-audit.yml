name: OpenShell RL egress offline checks
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'examples/openshell-rl-egress-audit-python/**'
      - '.github/workflows/openshell-rl-egress-audit.yml'
  push:
    branches: [main]
    paths:
      - 'examples/openshell-rl-egress-audit-python/**'
      - '.github/workflows/openshell-rl-egress-audit.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/openshell-rl-egress-audit-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
