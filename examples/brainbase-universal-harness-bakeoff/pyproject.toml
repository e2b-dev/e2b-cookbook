[project]
name = "brainbase-universal-harness-bakeoff"
version = "0.1.0"
description = "Hand several harnesses the same buggy function to fix, each in its own E2B sandbox, grade against hidden tests, and rank; through the Brainbase Universal Harness API."
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "httpx>=0.27",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
