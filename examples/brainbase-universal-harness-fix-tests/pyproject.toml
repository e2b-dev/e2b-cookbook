[project]
name = "brainbase-universal-harness-fix-tests"
version = "0.1.0"
description = "A background coding agent fixes a failing pytest suite in an E2B sandbox, through the Brainbase Universal Harness API."
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "httpx>=0.27",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
