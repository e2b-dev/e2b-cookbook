[project]
name = "brainbase-universal-harness-live-app"
version = "0.1.0"
description = "A coding agent builds and serves a web app in an E2B sandbox and returns a branded public preview URL, through the Brainbase Universal Harness API."
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "httpx>=0.27",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
