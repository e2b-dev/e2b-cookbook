[tool.poetry]
name = "langgraph-e2b-python"
version = "0.1.0"
description = "Example project for showcasing E2B code interpreter with LangGraph"
authors = ["Vasek Mlejnsky <vasek@e2b.dev>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
langgraph = "^1.0.6"
# e2b 2.38.0 dropped the http2 kwarg from get_transport(), which every current
# e2b-code-interpreter release still passes. Cap e2b until that is fixed upstream.
e2b-code-interpreter = "^2.9.0"
e2b = ">=2.26,<2.38"
langchain = "^1.2.6"
python-dotenv = "^1.2.1"
langchain-openai = "^1.1.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "langgraph_e2b_python.main:main"
