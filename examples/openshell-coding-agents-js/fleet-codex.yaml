# Provider profile for Codex with an OpenAI API key, in the openshell-workload-agents
# template. Based on OpenShell's providers/openai.yaml (Apache-2.0). Changes: the id,
# and the binary: only the Codex CLI at /usr/bin/codex may use the key. src/agents.ts
# points Codex at OPENAI_API_KEY with a model provider (env_key), so no login is needed.
# (OpenShell's providers/codex.yaml is for ChatGPT sign-in tokens instead.)
# Scope: the binary below and the processes it starts may send the key to the whole
# API host (read-write), not only the inference route. Use a project-scoped key.
#   openshell provider profile import -f fleet-codex.yaml --global   (src/main.ts does this)
id: fleet-codex
display_name: Codex (fleet)
description: Codex CLI with an OpenAI API key
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key used by Codex
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/codex]
