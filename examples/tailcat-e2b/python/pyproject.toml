[project]
name = "tailcat-e2b"
version = "0.1.0"
description = "Tailcat (Tailscale data plane, no control plane) between E2B sandboxes and your laptop"
authors = [{ name = "Tomas Varga", email = "tomasvarga@sudolabs.io" }]
requires-python = ">=3.11,<4"
dependencies = [
    "e2b>=2.46.0,<3",
    "python-dotenv>=1.0.1,<2",
]

[project.scripts]
start = "tailcat_e2b.sandbox_to_sandbox:main"  # the one script that needs nothing on your machine
build-template = "tailcat_e2b.build_template:main"
laptop-sandbox-file-transfer = "tailcat_e2b.laptop_sandbox_file_transfer:main"
sandbox-to-sandbox = "tailcat_e2b.sandbox_to_sandbox:main"
sandbox-tests-local-dev-server = "tailcat_e2b.sandbox_tests_local_dev_server:main"

[tool.hatch.build.targets.wheel]
packages = ["tailcat_e2b"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
