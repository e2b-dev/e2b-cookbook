[project]
name = "trl-grpo-python"
version = "0.1.0"
description = "Train a coding model with TRL GRPO and E2B code rewards"
requires-python = ">=3.11,<3.14"
dependencies = ["e2b>=2.53.1,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
training = ["trl==1.14.2", "torch>=2.2", "datasets>=3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
